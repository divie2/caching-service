# Switches the API to Postgres. The only change to the API itself is DATABASE_URL.
services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://cache:cache@postgres:5432/cache
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cache
      POSTGRES_PASSWORD: cache
      POSTGRES_DB: cache
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cache -d cache"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
